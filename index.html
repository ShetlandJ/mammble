<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mammble</title>
  <meta name="description" content="A friendly word game to play against the computer.">
  <meta name="theme-color" content="#24543f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mammble">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">Mammble</h1>
    <div class="scores">
      <div class="score" id="score-you"><span class="who">You</span><span class="pts" id="pts-you">0</span></div>
      <div class="score" id="score-cpu"><span class="who">Computer</span><span class="pts" id="pts-cpu">0</span></div>
    </div>
    <div class="bag" id="bag"></div>
    <button class="btn btn-small" id="btn-new" type="button">New game</button>
  </header>

  <main class="layout">
    <section class="board-area">
      <div class="board" id="board" role="grid" aria-label="Game board"></div>
      <ul class="legend" aria-label="Bonus squares">
        <li><span class="swatch tw"></span>Triple word</li>
        <li><span class="swatch dw"></span>Double word</li>
        <li><span class="swatch tl"></span>Triple letter</li>
        <li><span class="swatch dl"></span>Double letter</li>
      </ul>
    </section>

    <section class="side">
      <div class="status" id="status" role="status" aria-live="polite">Loading the dictionary…</div>

      <div class="rack-area" id="rack-area">
        <div class="rack" id="rack" aria-label="Your tiles"></div>
      </div>

      <div class="controls" id="controls">
        <button class="btn btn-play" id="btn-play" type="button" disabled>Play word</button>
        <button class="btn" id="btn-takeback" type="button" disabled>Take back</button>
        <button class="btn" id="btn-shuffle" type="button">Shuffle</button>
        <button class="btn" id="btn-hint" type="button">Hint</button>
        <button class="btn" id="btn-swap" type="button">Swap tiles</button>
        <button class="btn" id="btn-pass" type="button">Pass</button>
      </div>

      <div class="controls swap-controls" id="swap-controls" hidden>
        <button class="btn btn-play" id="btn-swap-go" type="button" disabled>Swap chosen tiles</button>
        <button class="btn" id="btn-swap-cancel" type="button">Cancel</button>
      </div>

      <div class="history">
        <h2>Words played</h2>
        <ol id="history"></ol>
      </div>
    </section>
  </main>

  <footer class="debug" id="debug"></footer>

  <div class="overlay" id="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <div class="dialog-buttons" id="dialog-buttons"></div>
    </div>
  </div>

  <script src="words.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
